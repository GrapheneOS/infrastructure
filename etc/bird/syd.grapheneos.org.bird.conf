define public_ipv4 = 107.191.57.135;
define public_ipv6 = 2401:c080:1800:1c40:5400:5ff:fec7:c902;
define neighbor_as = 64515;
define neighbor_ipv4 = 169.254.169.254;
define neighbor_ipv6 = 2001:19f0:ffff::1;
define bgp_password = "{{bgp_password}}";

log syslog all;

router id public_ipv4;

protocol device {
    scan time 10;
}

filter grapheneos_filter {
    # AAPT: only advertise to customers and domestic peers for Australia and New Zealand
    bgp_community.add((2764, 15));

    accept;
}

template bgp grapheneos {
    local as 40806;
    graceful restart on;
    hold time 60;
    connect delay time 0;
    connect retry time 5;
    authentication md5;
    password bgp_password;
}

protocol bgp vultr_ipv4 from grapheneos {
    multihop 2;
    source address public_ipv4;
    neighbor neighbor_ipv4 as neighbor_as;
    ipv4 {
        import none;
        export filter grapheneos_filter;
    };
}

protocol bgp vultr_ipv6 from grapheneos {
    multihop 2;
    source address public_ipv6;
    neighbor neighbor_ipv6 as neighbor_as;
    ipv6 {
        import none;
        export filter grapheneos_filter;
    };
}

protocol static grapheneos_ipv6_route {
    route 2602:f4d9:d::/48 via public_ipv6;
    ipv6;
}
